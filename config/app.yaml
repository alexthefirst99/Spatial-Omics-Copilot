ollama:
  host: "http://localhost:11434"
  model: "qwen2.5vl:7b"
  vision_model: "qwen2.5vl:7b"
  timeout: 120
  # Safety ceiling only — the prompt instructs the model to answer in ~3-4
  # sentences, so this just needs enough room for that to actually finish
  # instead of a hard mid-sentence cutoff.
  num_predict: 220
  keep_alive: "10m"
  # Load both the text and vision models into memory at app startup instead
  # of on the user's first chat message, so the first real message isn't the
  # slow cold-start one.
  warmup: true

paths:
  chat_dir: "data/chat_sessions"
  status_dir: "data/status_data"
  workspace_map: "data/workspace_map.json"
  workdir_base: "tmp_data/workdirs"
  tmp_base: "tmp_data"
  tutorial_image: "tutorial/loki_tutorial_hskin_melanoma_downsampled.ome.tif"

app:
  hot_reload: false

pathway_enrichment:
  gene_sets:
    - "GO_Biological_Process_2023"
    - "KEGG_2021_Human"
  organism: "Human"
  top_n: 10
  max_genes: 100
  adjusted_p_value_cutoff: 0.05
  significant_only: true
  timeout: 30
  max_retries: 2

gene_annotation:
  organism: "Homo sapiens"
  max_genes: 10
  timeout: 15
  max_retries: 2
  tool: "spatial_omics_copilot"

# LangGraph copilot agent (Person 5).
copilot_agent:
  # Hard cap on tool calls per turn (docs/rules.md section 4).
  max_tool_calls: 5
  # Disease anchor for the PubMed query. THIS MUST MATCH THE LOADED SLIDE.
  # A wrong value does not fail loudly — it returns confident, well-formed
  # papers about the wrong cancer. Verified live: a breast-tissue ROI analysed
  # with "colorectal cancer" returned three colorectal papers that looked
  # entirely credible. The value now appears in the AGENT TRACE so it can be
  # checked at a glance during a demo.
  # data/demo currently holds the 10x Visium HD Human Colon Cancer dataset,
  # matching this anchor. Update this value if a different disease's .h5ad is
  # ever loaded into data/demo.
  disease: "colorectal cancer"
  # Re-rank retrieved abstracts against the question with ChromaDB. Off by
  # default: Chroma's default embedding function downloads a ~79 MB ONNX model
  # on first use, and it swallows failures, so an error looks like "no matches".
  semantic_rerank: false

# DeepInfra LLM provider (T-047). Optional — the app defaults to local Ollama.
# The API key belongs in .env, never here.
deepinfra:
  base_url: "https://api.deepinfra.com/v1/openai"
  # No default model id: DeepInfra's catalogue changes, and silently calling a
  # model nobody chose is worse than a clear "not configured" error.
  # Vision-capable options include Qwen/Qwen2.5-VL-7B-Instruct,
  # Qwen/Qwen2.5-VL-32B-Instruct and meta-llama/Llama-3.2-11B-Vision-Instruct.
  model: ""
  # Leave unset to infer vision support from the model name; set true/false to
  # override that inference.
  # vision: true
  timeout: 60
  max_tokens: 512
  temperature: 0.2
  max_retries: 2
