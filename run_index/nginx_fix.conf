# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===========================
    # REQUIRED FOR LARGE UPLOADS
    # ===========================
    client_max_body_size 20G;

    include /etc/nginx/conf.d/*.conf;

    # ===========================
    # HTTP → HTTPS REDIRECT
    # ===========================
    server {
        listen 80;
        server_name wanglab.tech;
        return 301 https://$host$request_uri;
    }

    # ===========================
    # HTTPS SERVER
    # ===========================
    server {
        listen 443 ssl;
        server_name wanglab.tech;

        ssl_certificate /etc/letsencrypt/live/wanglab.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wanglab.tech/privkey.pem;

        # ===========================
        # Loki launcher
        # ===========================
        location /loki_launch/ {
            proxy_pass http://127.0.0.1:2002/loki_launch/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===========================
        # MAIN APP (UPLOADS HERE)
        # ===========================
        location /app/ {
            proxy_pass http://127.0.0.1:6000/app/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ---- upload critical ----
            client_max_body_size 20G;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_connect_timeout 3600;
            send_timeout 3600;

            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ===========================
        # TILE SERVER
        # ===========================
        location /tiles/ {
            proxy_pass http://127.0.0.1:6000/tiles/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 20G;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_connect_timeout 3600;
            send_timeout 3600;

            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ===========================
        # STATIC GITHUB PROXIES
        # ===========================
        location /loki/ {
            proxy_pass https://guangyuwanglab2021.github.io/Loki/;
            proxy_ssl_name guangyuwanglab2021.github.io;
            proxy_set_header Host guangyuwanglab2021.github.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            sub_filter 'href="/Loki/' 'href="/loki/';
            sub_filter 'src="/Loki/' 'src="/loki/';
            sub_filter_once off;
            proxy_set_header Accept-Encoding "";
        }

        location /cellDancer/ {
            proxy_pass https://guangyuwanglab2021.github.io/cellDancer_website/;
            proxy_ssl_name guangyuwanglab2021.github.io;
            proxy_set_header Host guangyuwanglab2021.github.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            sub_filter 'href="/cellDancer_website/' 'href="/cellDancer/';
            sub_filter 'src="/cellDancer_website/' 'src="/cellDancer/';
            sub_filter_once off;
            proxy_set_header Accept-Encoding "";
        }

        location /thor/ {
            proxy_pass https://guangyuwanglab2021.github.io/Thor/;
            proxy_ssl_name guangyuwanglab2021.github.io;
            proxy_set_header Host guangyuwanglab2021.github.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            sub_filter 'href="/Thor/' 'href="/thor/';
            sub_filter 'src="/Thor/' 'src="/thor/';
            sub_filter_once off;
            proxy_set_header Accept-Encoding "";
        }

        location /web/ {
            proxy_pass https://guangyuwanglab.github.io/web/;
            proxy_ssl_name guangyuwanglab.github.io;
            proxy_set_header Host guangyuwanglab.github.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            sub_filter_once off;
            proxy_set_header Accept-Encoding "";
        }
    }
}
