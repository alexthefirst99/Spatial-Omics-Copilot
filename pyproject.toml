[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-omics-copilot"
version = "0.3.0"
description = "AI copilot for spatial transcriptomics image exploration and RAG analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dash==2.14.1",
    "dash_loading_spinners==1.0.0",
    "Flask==2.3.3",
    "flask-cors",
    "plotly==5.18.0",
    "requests",
    "boto3==1.28.17",
    "s3fs==2023.9.2",
    "anndata==0.10.3",
    "h5py>=3.10",
    "matplotlib==3.8.1",
    "numpy==1.26.1",
    "pandas==2.1.1",
    "scanpy==1.9.6",
    "scikit-image==0.22.0",
    "scikit-learn==1.3.2",
    "scipy==1.11.3",
    "numba==0.59.1",
    "llvmlite==0.42.0",
    "opencv-contrib-python==4.6.0.66",
    "opencv-python==4.8.1.78",
    "opencv-python-headless==4.8.1.78",
    "Pillow==10.0.1",
    "pyproj==3.6.1",
    "pyvips>=2.2.1",
    "rasterio==1.3.9",
    "shapely==2.0.2",
    "tifffile==2024.8.30",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.1.0",
    "gseapy==1.1.2",
    "biopython>=1.83",
    "chromadb>=1.5,<2.0",
    "ipyleaflet==0.17.4",
    "ollama",
    "packaging>=24.0",
    "PyYAML>=6.0",
    "toml==0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
spatial-copilot = "app.app:main"

[tool.pytest.ini_options]
testpaths = ["src/tests", "tests"]

[tool.setuptools]
packages = [
    "app",
    "niceview",
    "niceview.interface",
    "niceview.pyplot",
    "niceview.utils",
    "rag",
    "rag.agent",
    "rag.deg",
    "rag.pathway",
    "rag.pathway_enrichment",
    "rag.gene_annotation",
    "rag.pubmed",
    "rag.pubmed_retrieval",
]
package-dir = {"" = "src", "app" = "app"}
include-package-data = false

[tool.setuptools.package-data]
app = ["assets/*"]
